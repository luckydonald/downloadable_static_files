name: Deploy downloaded userscript to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Repository containing the build artifact
        required: true
        type: string

      source_run_id:
        description: Workflow run containing the build artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download userscript artifact
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p site

          gh run download "$SOURCE_RUN_ID" \
            --repo "$SOURCE_REPO" \
            --name userscript \
            --dir site

      - name: List downloaded files
        run: find site -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
